name: AstroBrief Daily

on:
  schedule:
    # Weekdays, Beijing 09:30 (UTC 01:30)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AstroBrief
        env:
          TOKEN: ${{ github.token }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ASTROBRIEF_CONTACT: ${{ vars.ASTROBRIEF_CONTACT }}
        run: python daily.py -t "${{ github.token }}"

      - name: Commit generated briefs
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- LATEST.md briefs/ scores/
          if git diff --cached --quiet; then
            echo "No generated AstroBrief changes to commit."
          else
            git commit -m "Update AstroBrief $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
