name: AstroBrief Daily

on:
  # Production timing is driven by the always-on Tsinghua server via
  # workflow_dispatch. Keep one deliberately late GitHub-native schedule only
  # as an emergency fallback in case the external trigger/token/server fails.
  schedule:
    # Weekdays, Beijing 13:43 (UTC 05:43). This is intentionally later than the
    # server's DST-aware polling window (which may extend as late as 12:55 BJT in
    # standard time). The batch-date sent marker prevents duplicate mail when the
    # server-triggered run has already succeeded.
    - cron: '43 5 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a run even if the retrieved arXiv batch already has a sent marker'
        required: false
        default: false
        type: boolean

# Serialize server-triggered, manual, and emergency-fallback runs so only one can
# reach the mail-sending section at a time.
concurrency:
  group: astrobrief-daily-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AstroBrief
        env:
          TOKEN: ${{ github.token }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ASTROBRIEF_CONTACT: ${{ vars.ASTROBRIEF_CONTACT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python daily.py -t "${{ github.token }}" --force
          else
            python daily.py -t "${{ github.token }}"
          fi

      - name: Commit generated briefs and send state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- LATEST.md briefs scores state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated AstroBrief changes to commit."
          else
            git commit -m "Update AstroBrief $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
