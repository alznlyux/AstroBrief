name: AstroBrief Daily

on:
  schedule:
    # Primary: weekdays, Beijing 09:30 (UTC 01:30)
    - cron: '30 1 * * 1-5'
    # Fallback: weekdays, Beijing 10:17 (UTC 02:17).
    # Avoid the top of the UTC hour, where GitHub documents heavier scheduler load.
    # daily.py exits immediately if the day's successful-send marker exists.
    - cron: '17 2 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a run even if today already has a sent marker'
        required: false
        default: false
        type: boolean

# Scheduled events can be delayed. If primary and fallback are released together,
# serialize them so only one can reach the mail-sending section at a time.
concurrency:
  group: astrobrief-daily-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AstroBrief
        env:
          TOKEN: ${{ github.token }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ASTROBRIEF_CONTACT: ${{ vars.ASTROBRIEF_CONTACT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python daily.py -t "${{ github.token }}" --force
          else
            python daily.py -t "${{ github.token }}"
          fi

      - name: Commit generated briefs and send state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- LATEST.md briefs scores state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated AstroBrief changes to commit."
          else
            git commit -m "Update AstroBrief $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
