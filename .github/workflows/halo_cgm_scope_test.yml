name: AstroBrief HVC CGM Scope Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halo_cgm_scope_test.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile modified production code
        run: python -m py_compile semantic_recommender.py semantic_smoke_test.py semantic_daily.py daily.py github_issue.py

      - name: Validate HVC and CGM scope rules
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          cfg = json.loads(Path('semantic_topics.json').read_text(encoding='utf-8'))
          assert 'halo_cgm' in cfg['positive_topics']
          assert 'igm_reionization' in cfg['negative_topics']
          assert 'cgm_igm' not in cfg['negative_topics']

          halo_terms = cfg['positive_topics']['halo_cgm']['lexical_terms']
          assert 'HVC' in halo_terms
          assert 'circumgalactic medium' in halo_terms
          assert 'CGM' in halo_terms
          assert 'Galactic halo' not in halo_terms

          src = Path('semantic_recommender.py').read_text(encoding='utf-8')
          assert '(r"\\bGalactic halo\\b", 2.5)' not in src

          direct = re.compile(
              r'\b(?:high[- ]velocity clouds?|HVCs?|intermediate[- ]velocity clouds?|IVCs?|'
              r'Magellanic Stream|halo gas|circumgalactic medium|CGM|galactic fountain)\b',
              re.I,
          )
          halo = re.compile(r'\bGalactic halo\b', re.I)
          gas = re.compile(r'\b(?:gas|H\s*I|neutral|ionized|clouds?|medium)\b', re.I)

          def target(title):
              return bool(direct.search(title) or (halo.search(title) and gas.search(title)))

          assert target('High-velocity clouds in the Milky Way halo')
          assert target('Multiphase gas in the circumgalactic medium of nearby galaxies')
          assert target('Neutral gas in the Galactic halo')
          assert not target('A model for hypervelocity stars in the Galactic halo')
          assert not target('Stellar streams in the Galactic halo')
          PY

      - name: Record successful validation
        run: |
          mkdir -p .ci
          printf 'HVC/halo gas/CGM rule validation passed\n' > .ci/halo_cgm_scope_test_passed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/halo_cgm_scope_test_passed.txt
          git commit -m "Confirm HVC and CGM scope regression"
          git push
