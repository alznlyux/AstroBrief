name: AstroBrief HVC CGM Scope Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halo_cgm_scope_test.yml'

# One-time validation workflow for the HVC / halo gas / CGM scope extension.
# Re-triggered after tightening Galactic-halo gas evidence.
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production code
        run: python -m py_compile daily.py semantic_daily.py semantic_recommender.py semantic_smoke_test.py github_issue.py

      - name: Run HVC and CGM regression suite
        run: python semantic_smoke_test.py

      - name: Record successful regression
        run: |
          mkdir -p .ci
          printf 'HVC/halo gas/CGM regression passed\n' > .ci/halo_cgm_scope_test_passed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/halo_cgm_scope_test_passed.txt
          git commit -m "Confirm HVC and CGM scope regression"
          git push
