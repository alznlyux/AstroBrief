name: AstroBrief Historical 2502.10897 Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical_250210897_test.yml'

# One-time exact-date validation for arXiv:2502.10897.
jobs:
  historical-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen 2025-02-15 and send current EMAIL_TO
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ASTROBRIEF_CONTACT: ${{ vars.ASTROBRIEF_CONTACT }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from semantic_daily import _fetch_arxiv_day, apply_final_scope_guard, build_reports, send_email
          from semantic_recommender import score_papers

          day = dt.date(2025, 2, 15)
          target_id = '2502.10897'
          papers = _fetch_arxiv_day(day)
          scored, summary = score_papers(papers)
          scored, summary = apply_final_scope_guard(scored, summary)
          issue_title = f'Historical astro-ph submissions for {day.isoformat()}'
          _, email_report = build_reports(issue_title, scored, summary)
          selected = [p for p in scored if p['priority'] in {'A', 'B'}]
          send_email(email_report, len(selected))

          target = next((p for p in scored if p['id'] == target_id), None)
          result = {
              'screened_date': day.isoformat(),
              'candidate_count': summary['candidate_count'],
              'A': summary['A'],
              'B': summary['B'],
              'C': summary['C'],
              'SKIP': summary['SKIP'],
              'emailed_count': len(selected),
              'target': None if target is None else {
                  'id': target['id'],
                  'title': target['title'],
                  'priority': target['priority'],
                  'score': target['score'],
                  'best_positive_topic': target.get('best_positive_topic'),
                  'top_topics': target.get('top_topics'),
                  'best_negative_topic': target.get('best_negative_topic'),
                  'domain_evidence_score': target.get('domain_evidence_score'),
                  'title_domain_score': target.get('title_domain_score'),
                  'gate_reason': target.get('gate_reason'),
                  'nli_reason': target.get('nli_reason'),
                  'scope_reason': target.get('scope_reason'),
              },
              'emailed_ids': [p['id'] for p in selected],
          }
          Path('.ci').mkdir(exist_ok=True)
          Path('.ci/historical_250210897_result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Record historical test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/historical_250210897_result.json
          git commit -m "Record 2502.10897 historical screening test"
          git push
