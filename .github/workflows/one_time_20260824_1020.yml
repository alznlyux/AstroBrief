name: AstroBrief One-Time 2026-08-24 11:10 CST

on:
  schedule:
    # One-time test target: 2026-08-24 11:10 Beijing time = 03:10 UTC.
    # This gives GitHub's scheduler substantially more lead time than the
    # previous 10:20 test, whose workflow was committed only ~10 minutes earlier.
    - cron: '10 3 * * *'
  workflow_dispatch: {}

jobs:
  run-once:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Verify one-time target date
        if: ${{ github.event_name == 'schedule' }}
        run: |
          test "$(date -u +'%Y-%m-%d')" = "2026-08-24"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: astrobrief-models-${{ runner.os }}-v1
          restore-keys: |
            astrobrief-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AstroBrief one-time test
        env:
          TOKEN: ${{ github.token }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ASTROBRIEF_CONTACT: ${{ vars.ASTROBRIEF_CONTACT }}
        run: python daily.py -t "${{ github.token }}"

      - name: Commit generated briefs and send state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- LATEST.md briefs scores state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated AstroBrief changes to commit."
          else
            git commit -m "One-time AstroBrief test $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
